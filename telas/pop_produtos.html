<html>
    <head>
        <title>Pensar em um tema</title>
        <link href="../CSS/estilo.css" rel="stylesheet"/>
        <link href="../CSS/estilo_produtos.css" rel="stylesheet"/>
    </head>
    <body>
        <main>
            <div class="pop">
                <h1 id="nome-produto">Produto</h1>
                
                <div class="slider">
                    <button id="prevBtn">&#10094;</button>
                    <img id="slider-img" src="" alt="">
                    <button id="nextBtn">&#10095;</button>
                </div>
                <p id="descricao-produto"></p>
                
                <script>
                    // Função auxiliar para capturar os dados da URL
                    function capturaDados(dado){
                        let urlParams = new URLSearchParams(window.location.search);
                        return urlParams.get(dado);
                    }

                    // Captura as strings puras vindas da URL
                    const nome = capturaDados("nome");
                    const descricao = capturaDados("descricao");

                    // Preenche o texto básico na tela
                    document.getElementById("nome-produto").textContent = nome;
                    document.getElementById("descricao-produto").textContent = descricao;

                    /* --- Controle do Slider --- */
                    // Pega o parâmetro 'imagem', se ele existir quebra os itens pelas vírgulas para gerar o Array
                    const imagens = capturaDados("imagem") ? capturaDados("imagem").split(',') : [];
                    let index = 0;
                    const sliderImg = document.getElementById("slider-img");

                    function MostrarImagem(){
                        if(imagens.length > 0){
                            sliderImg.src = imagens[index];
                        }
                    }

                    document.getElementById("prevBtn").onclick = function() {
                        index = (index - 1 + imagens.length) % imagens.length;
                        MostrarImagem();
                    }

                    document.getElementById("nextBtn").onclick = function() {
                        index = (index + 1) % imagens.length;
                        MostrarImagem();
                    }

                    // Exibe a primeira imagem ao carregar o pop-up
                    MostrarImagem();
                </script>
            </div>
        </main>
    </body>
</html>
